<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Impact Quest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f0fdfa; color: #0f172a; }
        h1, h2, h3, .fredoka { font-family: 'Fredoka', sans-serif; }
        .card-pop { transition: transform 0.2s, box-shadow 0.2s; }
        .card-pop:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .hidden { display: none; }
        .gradient-text { background: linear-gradient(to right, #0ea5e9, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Screen 1: Welcome -->
    <div id="screen-welcome" class="max-w-2xl w-full bg-white rounded-3xl shadow-xl p-8 text-center border-4 border-teal-100">
        <div class="text-6xl mb-4">🌍✨</div>
        <h1 class="text-4xl md:text-5xl font-bold mb-4 gradient-text">Global Impact Quest</h1>
        <p class="text-lg text-gray-600 mb-8">Ready to change the world? Let's find your ultimate inquiry project!</p>
        <button onclick="showScreen('screen-goal')" class="bg-gradient-to-r from-teal-400 to-emerald-500 text-white font-bold text-xl py-4 px-8 rounded-full shadow-lg card-pop w-full md:w-auto">
            Let's Go! 🚀
        </button>
    </div>

    <!-- Screen 2: Goal -->
    <div id="screen-goal" class="hidden max-w-3xl w-full bg-white rounded-3xl shadow-xl p-8 text-center border-4 border-blue-100">
        <h2 class="text-3xl font-bold mb-6">Pick Your Vibe 🎯</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <button onclick="setGoal('Nature Ninja (SDGs 13-15)')" class="bg-green-100 border-2 border-green-300 p-6 rounded-2xl card-pop text-left">
                <div class="text-4xl mb-2">🌳</div>
                <h3 class="text-xl font-bold text-green-800">Nature Ninja</h3>
            </button>
            <button onclick="setGoal('Hauora Hero (SDG 3)')" class="bg-rose-100 border-2 border-rose-300 p-6 rounded-2xl card-pop text-left">
                <div class="text-4xl mb-2">❤️</div>
                <h3 class="text-xl font-bold text-rose-800">Wellness Hero</h3>
            </button>
            <button onclick="setGoal('Equality Champion (SDGs 5, 10)')" class="bg-purple-100 border-2 border-purple-300 p-6 rounded-2xl card-pop text-left">
                <div class="text-4xl mb-2">🤝</div>
                <h3 class="text-xl font-bold text-purple-800">Equality Champion</h3>
            </button>
            <button onclick="setGoal('Innovation Explorer (SDGs 9, 11)')" class="bg-amber-100 border-2 border-amber-300 p-6 rounded-2xl card-pop text-left">
                <div class="text-4xl mb-2">💡</div>
                <h3 class="text-xl font-bold text-amber-800">Innovation Explorer</h3>
            </button>
        </div>
    </div>

    <!-- Screen 3: Subject -->
    <div id="screen-subject" class="hidden max-w-2xl w-full bg-white rounded-3xl shadow-xl p-8 text-center border-4 border-indigo-100">
        <h2 class="text-3xl font-bold mb-6">Link Your Learning 📚</h2>
        <div class="grid grid-cols-2 gap-4">
            <button onclick="setSubject('Science')" class="bg-indigo-50 p-4 rounded-xl font-bold text-indigo-700 border-2 border-indigo-200">Science 🔬</button>
            <button onclick="setSubject('Maths')" class="bg-indigo-50 p-4 rounded-xl font-bold text-indigo-700 border-2 border-indigo-200">Maths ➗</button>
            <button onclick="setSubject('English')" class="bg-indigo-50 p-4 rounded-xl font-bold text-indigo-700 border-2 border-indigo-200">English ✍️</button>
            <button onclick="setSubject('Social Studies')" class="bg-indigo-50 p-4 rounded-xl font-bold text-indigo-700 border-2 border-indigo-200">Social Studies 🗺️</button>
        </div>
    </div>

    <!-- Screen 4: Path -->
    <div id="screen-path" class="hidden max-w-2xl w-full bg-white rounded-3xl shadow-xl p-8 text-center border-4 border-orange-100">
        <h2 class="text-3xl font-bold mb-6">Choose Your Path 🛤️</h2>
        <button onclick="showScreen('screen-idea')" class="w-full bg-orange-100 p-6 rounded-2xl mb-4 text-left border-2 border-orange-200">Turbocharge My Idea ⚡</button>
        <button onclick="startJourney()" class="w-full bg-sky-100 p-6 rounded-2xl text-left border-2 border-sky-200">Help Me Find My Passion 🧭</button>
    </div>

    <!-- Screen 5: Idea -->
    <div id="screen-idea" class="hidden max-w-2xl w-full bg-white rounded-3xl shadow-xl p-8 text-center border-4 border-pink-100">
        <h2 class="text-3xl font-bold mb-6">What's on your mind? 🧠</h2>
        <textarea id="user-idea" class="w-full h-32 p-4 border-2 rounded-xl mb-4" placeholder="Describe the problem you want to solve..."></textarea>
        <button onclick="submitIdea()" class="bg-pink-500 text-white font-bold py-3 px-8 rounded-full w-full">Send to AI</button>
    </div>

    <!-- Screen 6: Quiz -->
    <div id="screen-quiz" class="hidden max-w-2xl w-full bg-white rounded-3xl shadow-xl p-8 text-center border-4 border-yellow-100">
        <div id="quiz-progress" class="text-sm text-yellow-600 font-bold mb-2">Question 1/5</div>
        <h2 id="quiz-question" class="text-2xl font-bold mb-6 text-gray-800">Loading...</h2>
        <div id="quiz-options" class="space-y-4"></div>
    </div>

    <!-- Screen 7: Loading -->
    <div id="screen-loading" class="hidden max-w-2xl w-full bg-white rounded-3xl shadow-xl p-8 text-center border-4 border-purple-100">
        <div class="text-6xl mb-4 animate-bounce">🤖</div>
        <h2 class="text-2xl font-bold">AI Co-Pilot is Thinking...</h2>
    </div>

    <!-- Screen 8: Results -->
    <div id="screen-results" class="hidden max-w-2xl w-full bg-white rounded-3xl shadow-xl p-8 border-4 border-emerald-100">
        <h2 class="text-3xl font-bold text-emerald-800 mb-4">Your Inquiry Mission!</h2>
        <div id="ai-response-container" class="text-left font-medium leading-relaxed p-4 bg-gray-50 rounded-xl"></div>
        <button onclick="location.reload()" class="mt-8 bg-gray-200 py-2 px-6 rounded-full">Start Over</button>
    </div>

    <script>
        let state = { goal: '', subject: '', idea: '', quizIndex: 0, journeyPath: [] };
        
        const quizData = {
            'Nature Ninja (SDGs 13-15)': [
                { text: "1/5 Which environment calls to me?", options: [{text: "Our vast oceans and beautiful beaches. 🌊", issue: "ocean conservation"}, {text: "The forests and native bushland. 🌲", issue: "forest protection"}, {text: "Wildlife and endangered animal species. 🐢", issue: "wildlife preservation"}, {text: "Parks and nature in our city streets. 🏙️", issue: "urban green spaces"}]},
                { text: "2/5 What is the biggest threat here?", options: [{text: "Plastic waste clogging ecosystems. 🗑️", issue: "plastic pollution"}, {text: "Climate change and weird weather. 🌪️", issue: "climate change"}, {text: "Buildings taking over habitats. 🏗️", issue: "habitat loss"}, {text: "Water pollution from chemicals. 🧪", issue: "water toxicity"}]},
                { text: "3/5 Who are we standing up for?", options: [{text: "Our local neighborhood community. 🏡", issue: "local communities"}, {text: "The generations of the future. ⏳", issue: "future generations"}, {text: "The animals who can't speak. 🐾", issue: "animal rights"}, {text: "Our school environment. 🏫", issue: "the school environment"}]},
                { text: "4/5 How do I want to take action?", options: [{text: "Building cool tech or tools. 🛠️", issue: "technological engineering"}, {text: "Running campaigns and advocating. 📣", issue: "social advocacy"}, {text: "Doing scientific experiments. 🔬", issue: "scientific investigation"}, {text: "Creating art or stories to explain it. 🎨", issue: "creative communication"}]},
                { text: "5/5 What would success look like?", options: [{text: "Restoring nature to its natural state. ✨", issue: "ecosystem restoration"}, {text: "Changing a law or school rule. ⚖️", issue: "policy reform"}, {text: "Creating a new innovation that helps. 💡", issue: "technological innovation"}, {text: "Getting the community involved. 🤝", issue: "community activism"}]}
            ],
            'Hauora Hero (SDG 3)': [
                { text: "1/5 Who is the main person we are helping?", options: [{text: "My friends and classmates. 🎒", issue: "teenagers"}, {text: "Young children in my area. 🧸", issue: "children"}, {text: "Families who need support. 👨‍👩‍👧‍👦", issue: "families"}, {text: "The general public in my town. 🏘️", issue: "the community"}]},
                { text: "2/5 What is the main challenge they face?", options: [{text: "Feeling stressed, anxious, or overwhelmed. 😥", issue: "mental health"}, {text: "Not having healthy food to eat. 🥗", issue: "nutrition access"}, {text: "Not being active enough. 🏃", issue: "physical fitness"}, {text: "Spending too much time on screens. 📱", issue: "digital wellbeing"}]},
                { text: "3/5 Where do we want to make change?", options: [{text: "Here at our school. 🏫", issue: "education setting"}, {text: "In people's homes. 🏠", issue: "domestic setting"}, {text: "In digital online spaces. 🌐", issue: "digital environments"}, {text: "In public parks or clubs. ⚽", issue: "recreational spaces"}]},
                { text: "4/5 How do I want to help?", options: [{text: "By mentoring or talking to others. 🗣️", issue: "peer mentoring"}, {text: "By building a digital app or tool. 💻", issue: "digital tools"}, {text: "By organizing fun events. 🎉", issue: "social events"}, {text: "By raising awareness. 📢", issue: "awareness campaigns"}]},
                { text: "5/5 What do we want to see happen?", options: [{text: "People feeling genuinely happier. 😊", issue: "improved wellbeing"}, {text: "Better daily habits and routines. 📅", issue: "behavioral change"}, {text: "A reduction in stress levels. 🧘", issue: "stress reduction"}, {text: "Stronger social connections. 🤝", issue: "community connection"}]}
            ],
            'Equality Champion (SDGs 5, 10)': [
                { text: "1/5 Which issue matters most to me?", options: [{text: "Racial and cultural diversity. 🌍", issue: "racial equality"}, {text: "Gender fairness and stereotypes. ⚖️", issue: "gender equality"}, {text: "Fair treatment regardless of money. 💸", issue: "economic equality"}, {text: "Accessibility for people with disabilities. ♿", issue: "inclusive accessibility"}]},
                { text: "2/5 Where is the problem most visible?", options: [{text: "In the school system. 🏫", issue: "the education system"}, {text: "On social media platforms. 💻", issue: "digital media bias"}, {text: "In sports and clubs. 🏏", issue: "extracurricular activities"}, {text: "In society and the news. 📺", issue: "global society"}]},
                { text: "3/5 Who are we standing up for?", options: [{text: "My peers and classmates. 👫", issue: "peers"}, {text: "Minority groups needing a voice. 📣", issue: "marginalized groups"}, {text: "My neighborhood. 🏘️", issue: "local community"}, {text: "The rights of everyone. 🌟", issue: "universal equality"}]},
                { text: "4/5 What is my approach?", options: [{text: "Advocating for change. 📢", issue: "advocacy"}, {text: "Collecting data and research. 📊", issue: "data research"}, {text: "Collaborating with local groups. 🤝", issue: "community collaboration"}, {text: "Creating art or creative content. 🎨", issue: "creative expression"}]},
                { text: "5/5 What is our impact goal?", options: [{text: "Changing how people think. 🧠", issue: "shifting perspectives"}, {text: "Getting a new policy created. 📜", issue: "policy reform"}, {text: "Making places more accessible. 🚪", issue: "accessibility"}, {text: "Making things fairer for everyone. ✨", issue: "equity"}]}
            ],
            'Innovation Explorer (SDGs 9, 11)': [
                { text: "1/5 Which area of our world needs fresh thinking?", options: [{text: "Our transport and movement. 🚀", issue: "future transport"}, {text: "How we build our homes and cities. 🏗️", issue: "sustainable building"}, {text: "How we power our lives with energy. ☀️", issue: "renewable energy"}, {text: "Digital tools and how we connect online. 📱", issue: "software development"}]},
                { text: "2/5 What is the main problem we face here?", options: [{text: "We waste too much energy. ⚡", issue: "energy efficiency"}, {text: "Things are hard to use for some people. 🖐️", issue: "accessibility"}, {text: "We create way too much trash. ♻️", issue: "waste reduction"}, {text: "Places feel unsafe or unwelcoming. 🛡️", issue: "public safety"}]},
                { text: "3/5 Who would benefit most from a solution?", options: [{text: "Students at school. 🎓", issue: "students"}, {text: "The natural environment. 🌿", issue: "ecosystems"}, {text: "Small local businesses. 🏪", issue: "the local economy"}, {text: "Everyone in society. 🌎", issue: "society at large"}]},
                { text: "4/5 What is my best method for solving it?", options: [{text: "Prototyping and testing new designs. 📐", issue: "engineering design"}, {text: "Analyzing data to find real answers. 📈", issue: "data research"}, {text: "Planning better urban spaces. 🏙️", issue: "urban planning"}, {text: "Creative problem solving. 🧠", issue: "creative innovation"}]},
                { text: "5/5 What is the final goal?", options: [{text: "Saving money for regular people. 💰", issue: "economic savings"}, {text: "Making the world more sustainable. 🌱", issue: "sustainability"}, {text: "Making everything easier to use. 👍", issue: "user experience"}, {text: "Future-proofing our infrastructure. ⏳", issue: "future-proofing infrastructure"}]}
            ]
        };

        function showScreen(id) { document.querySelectorAll('div[id^="screen-"]').forEach(el => el.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
        function setGoal(g) { state.goal = g; showScreen('screen-subject'); }
        function setSubject(s) { state.subject = s; showScreen('screen-path'); }
        function startJourney() { state.quizIndex = 0; state.journeyPath = []; showQuizQuestion(); }
        function showQuizQuestion() {
            const questions = quizData[state.goal];
            if (state.quizIndex >= questions.length) { state.idea = "Focusing on " + state.journeyPath.join(" while thinking about "); generateAI(); return; }
            const q = questions[state.quizIndex];
            document.getElementById('quiz-question').innerText = q.text;
            document.getElementById('quiz-progress').innerText = `Step ${state.quizIndex + 1} of 5`;
            const container = document.getElementById('quiz-options'); container.innerHTML = '';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full bg-yellow-50 p-4 rounded-xl border-2 border-yellow-200 text-left font-medium card-pop";
                btn.innerText = opt.text;
                btn.onclick = () => { state.journeyPath.push(opt.issue); state.quizIndex++; showQuizQuestion(); };
                container.appendChild(btn);
            });
            showScreen('screen-quiz');
        }
        function submitIdea() { state.idea = document.getElementById('user-idea').value; generateAI(); }
        async function generateAI() {
            showScreen('screen-loading');
            try {
                // FIXED: Using window.location.origin to ensure the path is always correct
                const res = await fetch(window.location.origin + '/api/generate', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ prompt: `Student inquiry project on ${state.goal} for ${state.subject}. Context: ${state.idea}. Generate 3 engaging "How might we..." questions for 10-15 year olds. Numbered list.`})
                });
                
                if (!res.ok) throw new Error("Status " + res.status);
                
                const data = await res.json();
                
                // Extract text from Google's response structure
                const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || data.error || "No response received.";
                
                document.getElementById('ai-response-container').innerText = aiText;
                showScreen('screen-results');
            } catch(e) { 
                document.getElementById('ai-response-container').innerText = "Oops! Error: " + e.message; 
                showScreen('screen-results'); 
            }
        }
    </script>
</body>
</html>
