Global Impact Quest

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Impact Quest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Custom Styles for a playful, engaging UI */
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1, h2, h3, .brand-font {
            font-family: 'Fredoka', sans-serif;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1), inset 0 2px 0 rgba(255,255,255,0.5);
            border-radius: 2rem;
            border: 4px solid #fff;
        }

        .choice-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 0 #e5e7eb;
        }

        .choice-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #d1d5db;
        }

        .choice-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #d1d5db;
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        .animate-bounce-in {
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-8 text-gray-800">

    <canvas id="confetti-canvas"></canvas>

    <main class="w-full max-w-3xl glass-card p-6 sm:p-10 relative overflow-hidden">
        
        <!-- Progress Bar Container -->
        <div id="progress-container" class="hidden w-full h-4 bg-gray-200 rounded-full mb-8 overflow-hidden border border-gray-300">
            <div id="progress-bar" class="h-full bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 transition-all duration-500 ease-out w-0"></div>
        </div>

        <!-- Screens Container -->
        <div id="game-container">
            <!-- Screen content injected via JS -->
        </div>

    </main>

    <script>
        // Data Structure for the Game
        // Outcomes mapped to "Student Speak" SDGs
        const outcomes = {
            "N": {
                id: "N",
                title: "The Nature Ninja 🌿",
                subtitle: "Your passion is protecting our Earth.",
                sdgs: "UN Goals: Climate Action, Life Below Water, Life on Land.",
                description: "You care deeply about our environment, climate change, and our wildlife. You want to make sure our beaches, oceans, and forests are thriving for the future.",
                color: "from-green-400 to-emerald-600"
            },
            "P": {
                id: "P",
                title: "The Fairness Fighter 🤝",
                subtitle: "Your passion is people and making things equal.",
                sdgs: "UN Goals: No Poverty, Zero Hunger, Reduced Inequalities.",
                description: "You hate seeing people left out or struggling. You believe everyone deserves enough food, a safe home, and to be treated with total respect.",
                color: "from-orange-400 to-red-500"
            },
            "H": {
                id: "H",
                title: "The Wellness Hero ✨",
                subtitle: "Your passion is health, minds, and bodies.",
                sdgs: "UN Goals: Good Health and Wellbeing.",
                description: "You know that feeling good physically and mentally is the key to everything. You want to help teenagers handle stress, get active, and feel awesome about themselves.",
                color: "from-blue-400 to-indigo-600"
            },
            "I": {
                id: "I",
                title: "The Future Builder 🚀",
                subtitle: "Your passion is creating, inventing, and fixing broken systems.",
                sdgs: "UN Goals: Innovation, Sustainable Cities, Responsible Consumption.",
                description: "You love thinking outside the box. You look at trash, bad traffic, or boring cities and think, 'I can invent a better way to do this.' You're all about green tech.",
                color: "from-purple-400 to-pink-500"
            }
        };

        const journeys = {
            "N": [
                {
                    question: "Which area of nature are you most passionate about protecting?",
                    choices: [
                        { text: "Our oceans, beaches, and marine life.", emoji: "🌊", value: "ocean conservation and marine life" },
                        { text: "Forests, parks, and land animals.", emoji: "🌳", value: "protecting land ecosystems and wildlife" },
                        { text: "The climate and reducing pollution.", emoji: "🌍", value: "fighting climate change and reducing emissions" }
                    ]
                },
                {
                    question: "When you look around, what specific problem bothers you the most?",
                    choices: [
                        { text: "Too much single-use plastic and litter.", emoji: "🥤", value: "excessive plastic waste and littering" },
                        { text: "Not enough green spaces or trees.", emoji: "🏙️", value: "a lack of green spaces and nature" },
                        { text: "People wasting energy and resources.", emoji: "⚡", value: "energy waste and inefficient resource use" }
                    ]
                },
                {
                    question: "What kind of action sounds the most exciting to you?",
                    choices: [
                        { text: "Inventing a new eco-friendly product.", emoji: "💡", value: "inventing a new eco-friendly product" },
                        { text: "Starting a campaign to change people's habits.", emoji: "🗣️", value: "running an awareness campaign" },
                        { text: "Organizing a hands-on community project.", emoji: "🧤", value: "organizing a hands-on community project" }
                    ]
                }
            ],
            "P": [
                {
                    question: "Who do you most want to help in your community?",
                    choices: [
                        { text: "People who don't have enough food or shelter.", emoji: "🍲", value: "helping those facing poverty and hunger" },
                        { text: "People who are treated unfairly or bullied.", emoji: "🛑", value: "standing up against bullying and inequality" },
                        { text: "People who feel left out or isolated.", emoji: "🤝", value: "creating inclusion for isolated people" }
                    ]
                },
                {
                    question: "What specific issue have you noticed recently?",
                    choices: [
                        { text: "Food waste while others go hungry.", emoji: "🗑️", value: "food waste and unequal food access" },
                        { text: "Unfair rules or stereotypes at school or in town.", emoji: "⚖️", value: "unfair stereotypes and lack of equal opportunities" },
                        { text: "Lack of safe spaces for everyone to hang out.", emoji: "🏠", value: "the lack of safe, welcoming community spaces" }
                    ]
                },
                {
                    question: "How would you like to make a difference?",
                    choices: [
                        { text: "Creating a service or program to help directly.", emoji: "❤️", value: "creating a direct support service or program" },
                        { text: "Using art, writing, or media to share their stories.", emoji: "📸", value: "using media and storytelling to raise awareness" },
                        { text: "Changing rules or policies at school or in town.", emoji: "📜", value: "advocating for policy or rule changes" }
                    ]
                }
            ],
            "H": [
                {
                    question: "Which area of wellness is most important to you right now?",
                    choices: [
                        { text: "Mental health and reducing stress/anxiety.", emoji: "🧠", value: "mental health and reducing youth anxiety" },
                        { text: "Physical health, fitness, and sports.", emoji: "🏃🏽‍♀️", value: "promoting physical fitness and active lifestyles" },
                        { text: "Healthy eating and lifestyle habits.", emoji: "🍎", value: "encouraging healthy eating and nutrition" }
                    ]
                },
                {
                    question: "What's the biggest roadblock to wellness you see?",
                    choices: [
                        { text: "Social media making people feel bad about themselves.", emoji: "📱", value: "the negative impact of social media on self-esteem" },
                        { text: "Not enough fun, free ways to stay active.", emoji: "⚽", value: "the lack of accessible, fun ways to exercise" },
                        { text: "Junk food being cheaper and easier to get than healthy food.", emoji: "🍔", value: "junk food being more accessible than healthy options" }
                    ]
                },
                {
                    question: "How do you want to tackle this?",
                    choices: [
                        { text: "Designing an app or tool to help people track/improve health.", emoji: "💻", value: "designing a digital tool or app for health" },
                        { text: "Starting a club or support group at school.", emoji: "🏫", value: "creating a school club or support group" },
                        { text: "Running a fun school-wide challenge or event.", emoji: "🏆", value: "running a fun, engaging school-wide challenge" }
                    ]
                }
            ],
            "I": [
                {
                    question: "What gets you most excited about the future?",
                    choices: [
                        { text: "Cool new technology and gadgets.", emoji: "🤖", value: "leveraging new technology and gadgets" },
                        { text: "Designing smarter, greener cities and buildings.", emoji: "🏙️", value: "designing smarter, more sustainable urban spaces" },
                        { text: "Turning trash into treasure (recycling/upcycling).", emoji: "♻️", value: "improving recycling and the circular economy" }
                    ]
                },
                {
                    question: "What's a broken system you'd love to fix?",
                    choices: [
                        { text: "The way we throw away so much stuff (e-waste, fast fashion).", emoji: "👗", value: "the problem of fast fashion and e-waste" },
                        { text: "Boring, inefficient transport (traffic, bad public transit).", emoji: "🚌", value: "inefficient and polluting transportation systems" },
                        { text: "Everyday objects that aren't eco-friendly.", emoji: "🧴", value: "everyday products that aren't environmentally friendly" }
                    ]
                },
                {
                    question: "What's your innovator style?",
                    choices: [
                        { text: "Coding software, apps, or websites.", emoji: "⌨️", value: "coding a new software solution or app" },
                        { text: "Building physical prototypes or models.", emoji: "🛠️", value: "building a physical prototype or 3D model" },
                        { text: "Designing better systems or maps.", emoji: "🗺️", value: "designing a more efficient system or community map" }
                    ]
                }
            ]
        };

        let currentStep = 0;
        let userPersona = null;
        let userIdea = ""; 
        let userSubject = ""; 
        let journeyAnswers = [];
        
        const container = document.getElementById('game-container');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');

        function renderGoalSelection() {
            progressContainer.classList.add('hidden');
            
            container.innerHTML = `
                <div class="text-center animate-bounce-in">
                    <div class="text-6xl mb-4">🌍✨</div>
                    <h1 class="text-4xl sm:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-violet-600 mb-4 brand-font">
                        The Global Impact Quest
                    </h1>
                    <p class="text-lg text-gray-700 mb-6 max-w-2xl mx-auto font-bold bg-white/50 py-2 px-4 rounded-full inline-block border border-gray-200">
                        Step 1: Choose the Global Goal you care about most!
                    </p>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-2xl mx-auto mb-6 text-left">
                        <button onclick="selectGoal('N')" class="choice-btn bg-gradient-to-br from-green-50 to-emerald-100 border-2 border-green-200 p-5 rounded-2xl flex flex-col gap-2 hover:border-green-400">
                            <span class="text-4xl">🌿</span>
                            <span class="text-xl font-bold text-green-800 brand-font">Nature & Planet</span>
                            <span class="text-sm text-green-700">Climate, Oceans, Land</span>
                        </button>
                        <button onclick="selectGoal('P')" class="choice-btn bg-gradient-to-br from-orange-50 to-red-100 border-2 border-orange-200 p-5 rounded-2xl flex flex-col gap-2 hover:border-orange-400">
                            <span class="text-4xl">🤝</span>
                            <span class="text-xl font-bold text-orange-800 brand-font">People & Fairness</span>
                            <span class="text-sm text-orange-700">Equality, Poverty, Hunger</span>
                        </button>
                        <button onclick="selectGoal('H')" class="choice-btn bg-gradient-to-br from-blue-50 to-indigo-100 border-2 border-blue-200 p-5 rounded-2xl flex flex-col gap-2 hover:border-blue-400">
                            <span class="text-4xl">✨</span>
                            <span class="text-xl font-bold text-blue-800 brand-font">Wellness & Health</span>
                            <span class="text-sm text-blue-700">Mental Health, Fitness</span>
                        </button>
                        <button onclick="selectGoal('I')" class="choice-btn bg-gradient-to-br from-purple-50 to-pink-100 border-2 border-purple-200 p-5 rounded-2xl flex flex-col gap-2 hover:border-purple-400">
                            <span class="text-4xl">🚀</span>
                            <span class="text-xl font-bold text-purple-800 brand-font">Innovation & Cities</span>
                            <span class="text-sm text-purple-700">Tech, Recycling, Smart Cities</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function selectGoal(goalId) {
            userPersona = outcomes[goalId];
            renderPathSelection();
        }

        function renderPathSelection() {
            container.innerHTML = `
                <div class="text-center animate-fade-in">
                    <h2 class="text-xl font-bold text-gray-500 mb-2 brand-font uppercase tracking-widest">You Chose:</h2>
                    <h1 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r ${userPersona.color} mb-6 brand-font">
                        ${userPersona.title}
                    </h1>

                    <div class="bg-white/60 p-5 rounded-2xl mb-6 border border-white max-w-md mx-auto shadow-sm text-left">
                        <h3 class="font-bold text-gray-800 mb-2 brand-font">Step 2: What class or subject is this for? (Optional)</h3>
                        <input type="text" id="curriculum-subject" placeholder="e.g., Maths, Science, English..." class="w-full p-3 rounded-xl border-2 border-indigo-200 focus:border-indigo-500 focus:outline-none mb-5 text-gray-700" />

                        <div class="h-px bg-gray-300 w-full mb-5"></div>

                        <h3 class="font-bold text-gray-800 mb-2 brand-font">Step 3: Choose your path!</h3>
                        
                        <div class="mb-4">
                            <label class="font-bold text-sm text-pink-600 block mb-1">Path A: I already have a specific idea ⚡</label>
                            <input type="text" id="initial-idea" placeholder="What's your idea? (e.g., plastic at lunch...)" class="w-full p-3 rounded-xl border-2 border-pink-200 focus:border-pink-500 focus:outline-none mb-2 text-gray-700" />
                            <button onclick="startFastTrack()" class="w-full brand-font bg-gradient-to-r from-yellow-400 to-orange-500 text-white px-4 py-2 rounded-xl hover:from-yellow-500 hover:to-orange-600 transition shadow-md">
                                Turbocharge My Idea
                            </button>
                        </div>

                        <div class="flex items-center justify-center gap-4 mb-4">
                            <div class="h-px bg-gray-300 w-12"></div>
                            <span class="text-gray-400 font-bold uppercase tracking-wider text-xs">OR</span>
                            <div class="h-px bg-gray-300 w-12"></div>
                        </div>

                        <div>
                            <label class="font-bold text-sm text-indigo-600 block mb-1">Path B: Help me find an idea 🧭</label>
                            <button onclick="startGame()" class="w-full brand-font bg-gradient-to-r from-indigo-500 to-violet-500 text-white px-4 py-3 rounded-xl hover:from-indigo-600 hover:to-violet-600 transition shadow-md">
                                Start My Journey
                            </button>
                        </div>
                    </div>
                    
                    <button onclick="renderGoalSelection()" class="text-gray-500 hover:text-gray-800 text-sm font-bold underline">
                        Wait, let me pick a different Goal
                    </button>
                </div>
            `;
        }

        function startFastTrack() {
            const ideaInput = document.getElementById('initial-idea');
            const subjectInput = document.getElementById('curriculum-subject');
            
            userSubject = subjectInput ? subjectInput.value.trim() : "";

            if (ideaInput && ideaInput.value.trim() !== '') {
                userIdea = ideaInput.value.trim();
                renderAIResult();
            } else {
                ideaInput.classList.add('border-red-500');
                setTimeout(() => ideaInput.classList.remove('border-red-500'), 1500);
            }
        }

        function startGame() {
            const subjectInput = document.getElementById('curriculum-subject');
            userSubject = subjectInput ? subjectInput.value.trim() : "";

            currentStep = 0;
            journeyAnswers = [];
            progressContainer.classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const qList = journeys[userPersona.id];
            const progress = (currentStep / qList.length) * 100;
            progressBar.style.width = `${progress}%`;

            const q = qList[currentStep];
            
            const choicesHTML = q.choices.map((choice, index) => `
                <button onclick="handleChoice('${choice.value}')" 
                        class="choice-btn w-full bg-white border-2 border-gray-200 text-left p-4 sm:p-5 rounded-2xl flex items-center gap-4 text-gray-700 hover:border-pink-400 hover:bg-pink-50 group">
                    <span class="text-4xl group-hover:scale-110 transition-transform">${choice.emoji}</span>
                    <span class="text-lg sm:text-xl font-semibold">${choice.text}</span>
                </button>
            `).join('');

            container.innerHTML = `
                <div class="animate-fade-in">
                    <span class="text-sm font-bold tracking-wider text-pink-500 uppercase mb-2 block brand-font">
                        Question ${currentStep + 1} of ${qList.length}
                    </span>
                    <h2 class="text-2xl sm:text-3xl font-bold mb-8 text-gray-800 leading-tight">
                        ${q.question}
                    </h2>
                    <div class="space-y-4">
                        ${choicesHTML}
                    </div>
                </div>
            `;
        }

        function handleChoice(value) {
            journeyAnswers.push(value);
            currentStep++;
            
            const qList = journeys[userPersona.id];

            if (currentStep < qList.length) {
                renderQuestion();
            } else {
                // Compile the idea from answers
                userIdea = `I want to focus on ${journeyAnswers[0]}, specifically addressing ${journeyAnswers[1]}, by ${journeyAnswers[2]}.`;
                renderAIResult();
            }
        }

        function renderAIResult() {
            progressBar.style.width = `100%`;
            setTimeout(() => progressContainer.classList.add('hidden'), 500);

            container.innerHTML = `
                <div class="animate-bounce-in text-center">
                    <h2 class="text-xl font-bold text-gray-500 mb-2 brand-font uppercase tracking-widest">Your Mission Profile</h2>
                    <h1 class="text-4xl sm:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r ${userPersona.color} mb-4 brand-font">
                        ${userPersona.title}
                    </h1>
                    ${userSubject ? `<p class="text-md text-white mb-3 bg-indigo-500 inline-block px-4 py-1 rounded-full font-semibold shadow-sm">📚 Subject Link: ${userSubject}</p><br>` : ''}
                    
                    <div class="bg-gradient-to-br from-indigo-50 to-purple-100 p-6 rounded-2xl shadow-inner text-left border-2 border-indigo-200 mb-8 mt-4">
                        <div class="flex items-center gap-3 mb-4">
                            <span class="text-3xl">🤖</span>
                            <h3 class="text-2xl font-bold brand-font text-indigo-900">AI Co-Pilot</h3>
                        </div>
                        <p class="mb-4 text-indigo-800 font-medium">Here is the focus area we've built for you:</p>
                        
                        <div class="bg-white p-4 rounded-xl border-l-4 border-indigo-500 mb-4 shadow-sm">
                            <p class="text-gray-700 italic">"${userIdea}"</p>
                        </div>
                        
                        <input type="hidden" id="ai-input" value="${userIdea}" />
                        
                        <div id="ai-loading" class="text-center py-4">
                            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600 mb-2"></div>
                            <p class="text-indigo-600 font-medium">AI is crafting your perfect inquiry questions...</p>
                        </div>
                        
                        <div id="ai-results" class="hidden mt-6 space-y-3">
                            <!-- AI results injected here -->
                        </div>
                    </div>

                    <button onclick="renderGoalSelection()" class="brand-font bg-gray-800 text-white text-lg px-8 py-3 rounded-full hover:bg-black transition shadow-md">
                        Start Over 🔄
                    </button>
                </div>
            `;

            fireConfetti();
            
            // Auto trigger AI
            setTimeout(() => {
                generateAIMissions();
            }, 500);
        }

        async function generateAIMissions() {
            const inputField = document.getElementById('ai-input');
            const userIssue = inputField.value.trim();
            const btn = document.getElementById('ai-btn');
            const loading = document.getElementById('ai-loading');
            const resultsContainer = document.getElementById('ai-results');

            if (!userIssue) {
                if(inputField.type !== 'hidden') {
                    inputField.focus();
                    inputField.classList.add('border-red-500');
                    setTimeout(() => inputField.classList.remove('border-red-500'), 1500);
                }
                return;
            }

            // UI updates
            if (btn) btn.classList.add('hidden');
            if (inputField.type !== 'hidden') inputField.disabled = true;
            loading.classList.remove('hidden');
            resultsContainer.classList.add('hidden');

            const subjectContext = userSubject ? `CRITICAL REQUIREMENT: You MUST clearly connect the inquiry to their school subject: "${userSubject}". For example, if it's Maths, include data, measuring, or statistics in the question. If it's English, include writing, storytelling, or persuasion. If Art, include design or creation.` : "";
            const systemPrompt = `You are an inspiring educational AI guide for 10-15 year old students. Generate exactly 3 exciting, thought-provoking 'How might we...' inquiry questions based on the student's persona and the specific issue they care about. ${subjectContext} The questions must be easy to understand, highly actionable for a middle/high school student, and use emojis. Do not use markdown headers or bolding. Return each question on a new line starting with a bullet point '-'`;
            const userQuery = `My Persona: ${userPersona.title}. My Passion: ${userPersona.subtitle}. The specific issue I noticed in my community: ${userIssue}. ${userSubject ? `My Subject: ${userSubject}` : ''}`;
            
            const apiKey = ""; // Canvas injects this automatically
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                const candidate = result.candidates?.[0];

                loading.classList.add('hidden');
                resultsContainer.classList.remove('hidden');

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const text = candidate.content.parts[0].text;
                    
                    // Parse the bulleted list safely
                    const questions = text.split('\n').filter(line => line.trim().startsWith('-'));
                    
                    if (questions.length > 0) {
                        const promptsHTML = questions.map(prompt => `
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-indigo-100 flex items-start gap-3">
                                <span class="text-xl mt-1">🔥</span>
                                <span class="text-lg font-medium text-gray-800">${prompt.replace(/^\-\s*/, '')}</span>
                            </div>
                        `).join('');
                        
                        resultsContainer.innerHTML = `
                            <h4 class="font-bold text-indigo-900 mb-2">Your AI-Generated Missions:</h4>
                            ${promptsHTML}
                        `;
                    } else {
                        // Fallback if parsing fails but text exists
                        resultsContainer.innerHTML = `
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-indigo-100">
                                <p class="text-gray-800">${text}</p>
                            </div>
                        `;
                    }

                } else {
                    throw new Error("Invalid AI response format");
                }
            } catch (error) {
                console.error("AI Generation Error:", error);
                loading.classList.add('hidden');
                if (btn) btn.classList.remove('hidden');
                if (inputField.type !== 'hidden') inputField.disabled = false;
                
                // Fallback Prompts if API fails or is throttled
                resultsContainer.classList.remove('hidden');
                resultsContainer.innerHTML = `
                    <div class="bg-red-50 p-4 rounded-xl border border-red-200">
                        <p class="text-red-700">Oops, the AI Co-Pilot is taking a nap. But here's a mission to get you started:</p>
                        <p class="font-bold mt-2">How might we creatively solve "${userIssue}" in our school this term? 🤔</p>
                    </div>
                `;
            }
        }

        // Simple Confetti Implementation
        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const pieces = [];
            const colors = ['#f43f5e', '#a855f7', '#3b82f6', '#10b981', '#f59e0b'];

            for (let i = 0; i < 150; i++) {
                pieces.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2 + 100,
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 1) * 20 - 5,
                    size: Math.random() * 10 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 10
                });
            }

            function animateConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;

                pieces.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.5; // gravity
                    p.rotation += p.rotationSpeed;

                    if (p.y < canvas.height) {
                        active = true;
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rotation * Math.PI / 180);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                        ctx.restore();
                    }
                });

                if (active) {
                    requestAnimationFrame(animateConfetti);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }

            animateConfetti();
        }

        // Handle window resize for confetti canvas
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('confetti-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Initialize Game
        window.onload = renderGoalSelection;

    </script>
